name: Idea
description: A conversion, a tool or a change you would like.
labels: [enhancement]
body:
  - type: textarea
    id: idea
    attributes:
      label: The idea
      description: What you would like Pomelo to do, and for which files.
    validations:
      required: true
  - type: textarea
    id: today
    attributes:
      label: How you do it today
      description: The app or the steps you use now, if any.
